services:
  pihole:
    container_name: pihole
    image: pihole/pihole:latest
    restart: unless-stopped
    ports:
      - "${PORT_DNS_TCP:-53}:53/tcp"
      - "${PORT_DNS_UDP:-53}:53/udp"
      - "${PORT_HTTP:-80}:80/tcp"
      - "${PORT_HTTPS:-443}:443/tcp"
    environment:
      TZ: "${TZ:-America/Monterrey}"
      FTLCONF_webserver_api_password: "${PIHOLE_PASSWORD:?Set PIHOLE_PASSWORD in .env}"
      FTLCONF_dns_listeningMode: "${PIHOLE_DNS_MODE:-ALL}"
    volumes:
      - ./etc-pihole:/etc/pihole
      - ./etc-dnsmasq.d:/etc/dnsmasq.d
    cap_add:
      - NET_ADMIN
      - SYS_TIME
      - SYS_NICE
